name: Dart CI

on:
  push:
    branches:
      - v3*
  pull_request:
    branches:
      - v3*

jobs:
  integration_test_linux:
    name: Integration Test Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
      - name: Install Linux requirements
        run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v1
      - name: Build Isar Core
        run: |
          bash tool/build_linux.sh x64
          mv libisar_linux_x64.so packages/isar_flutter_libs/linux/libisar.so
      - name: Prepare Tests
        run: sh tool/prepare_tests.sh
      - name: Run Flutter Driver tests
        run: |
          flutter config --enable-linux-desktop 
          flutter test -d linux integration_test/integration_test.dart --dart-define STRESS=true
        working-directory: packages/isar_test

  integration_test_linux_arm:
    name: Integration Test ARM Linux
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Determine Flutter stable version
        uses: subosito/flutter-action@v2
        id: flutter-version
        with:
          architecture: 'x64'
          channel: 'stable'
          dry-run: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Prebuilt ARM linux builds are not provided, so build flutter from source
          channel: master
          flutter-version: "${{ steps.flutter-version.outputs.VERSION }}"
      - run: flutter --version
      - name: Install Linux requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v4
      - name: Display Rust version
        run: rustc --version && cargo --version
      - name: Build Isar Core
        run: |
          bash tool/build_linux.sh aarch64
          mv libisar_linux_arm64.so packages/isar_flutter_libs/linux/libisar.so
      - name: Prepare Tests
        run: sh tool/prepare_tests.sh
      - name: Run Flutter Driver tests
        run: |
          flutter config --enable-linux-desktop
          flutter test -d linux integration_test/integration_test.dart --dart-define STRESS=true
        working-directory: packages/isar_test
